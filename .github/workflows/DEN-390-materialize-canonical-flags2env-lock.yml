name: DEN-390 materialize canonical flags2env lock

on:
  push:
    branches:
      - DEN-390-canonical-flags2env-source
    paths:
      - package.json
      - .github/workflows/DEN-390-materialize-canonical-flags2env-lock.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          show-progress: false
      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lock from reviewed manifest without lifecycle scripts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm install --package-lock-only --ignore-scripts
          git diff --check
          actual="$(git diff --name-only | sort)"
          test "$actual" = 'package-lock.json' || {
            printf 'unexpected generated paths:\n%s\n' "$actual" >&2
            exit 1
          }
          grep -Fq 'https://github.com/flags-2-env/flags-2-env/archive/48530ec59759d9ecef5a283f49875de6540d2fab.tar.gz' package-lock.json
          if grep -Fq 'https://github.com/ORESoftware/flags-2-env' package-lock.json; then
            echo 'retired flags2env repository remains in generated lock' >&2
            exit 1
          fi
      - name: Prove generated lock installs and project tests pass
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run audit:cli
          git diff --check
      - name: Stage exact lock evidence
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/r2g-flags2env-lock"
          mkdir -p "$evidence"
          cp package-lock.json "$evidence/package-lock.json"
          sha256sum package-lock.json > "$evidence/SHA256SUMS"
          git diff --binary -- package-lock.json > "$evidence/package-lock.patch"
      - name: Upload exact generated lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r2g-flags2env-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r2g-flags2env-lock
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
