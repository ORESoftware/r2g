name: DEN-390 promote certified flags2env lock

on:
  push:
    branches:
      - DEN-390-canonical-flags2env-source
    paths:
      - .github/workflows/DEN-390-promote-certified-flags2env-lock.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-390-canonical-flags2env-source
          persist-credentials: true
          fetch-depth: 1
      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Reproduce the certified lock exactly
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          echo 'a33794caf4d638c1c3ea8721403b0728ad4a4bd85d81d3177008b2651b5a4ff5  package-lock.json' | sha256sum -c -
          grep -Fq 'https://github.com/flags-2-env/flags-2-env/archive/48530ec59759d9ecef5a283f49875de6540d2fab.tar.gz' package-lock.json
          ! grep -Fq 'https://github.com/ORESoftware/flags-2-env' package-lock.json
      - name: Commit only certified lock and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/DEN-390-materialize-canonical-flags2env-lock.yml
          git rm .github/workflows/DEN-390-promote-certified-flags2env-lock.yml
          git add package-lock.json
          actual="$(git diff --cached --name-only | sort)"
          expected=$'.github/workflows/DEN-390-materialize-canonical-flags2env-lock.yml\n.github/workflows/DEN-390-promote-certified-flags2env-lock.yml\npackage-lock.json'
          test "$actual" = "$expected" || {
            printf 'unexpected staged paths:\n%s\n' "$actual" >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-390: promote certified canonical flags2env lock'
          git push origin HEAD:DEN-390-canonical-flags2env-source
